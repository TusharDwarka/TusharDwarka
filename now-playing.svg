<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="104" viewBox="0 0 400 104">
  <style>
    .t{font:600 15px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#fff}
    .a{font:400 13px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#b3b3b3}
    .l{font:700 10px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#1DB954;letter-spacing:1.5px}
    .bar{fill:#1DB954;transform-box:fill-box;transform-origin:bottom}
    .b1{animation:eq .9s ease-in-out infinite alternate}
    .b2{animation:eq .7s ease-in-out .2s infinite alternate}
    .b3{animation:eq 1.1s ease-in-out .1s infinite alternate}
    .b4{animation:eq .8s ease-in-out .3s infinite alternate}
    .p{animation:prog 213s linear infinite}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    @keyframes prog{from{width:0}to{width:262px}}
  </style>
  <rect width="400" height="104" rx="10" fill="#181818"/>
